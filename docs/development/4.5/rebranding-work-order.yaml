      release_checksum: zrzavy-energy-monitor-<VERSION>.tar.gz.sha256
      release_manifest: release-manifest.json
    compatibility:
      entrypoint: app/solarinspector.py
      core_package: app/solarinspector_core
      release_archive: SolarInspector-<VERSION>.tar.gz
      policy: Der alte Einstiegspunkt und alte Importpfade dürfen als dünne Kompatibilitäts-Wrapper für
        lokale Tests und Rollback erhalten bleiben. Neue Produktlogik wird ausschließlich unter den neuen
        kanonischen Namen gepflegt.
  api:
    canonical_metadata:
      product_name: Zrzavy Energy Monitor
      product_id: zrzavy-energy-monitor
      description: Open-source home energy monitoring and validation
    compatibility:
    - Bestehende API-Endpunkte und Messfeldnamen nicht allein wegen des Rebrandings ändern.
    - Neue Produktmetadaten additiv ergänzen.
    - Bestehende Clients dürfen durch das Rebranding nicht brechen.
    - HTTP-Pfade mit solarinspector im Namen nur ändern, wenn solche Pfade tatsächlich existieren und
      ein Redirect beziehungsweise Alias bereitgestellt wird.
  web:
    title: Zrzavy Energy Monitor
    short_description: Open-source home energy monitoring and validation
    footer_policy: 'Die Bezeichnung ZEM darf nur ergänzend nach dem vollständigen Namen

      erscheinen, beispielsweise „Zrzavy Energy Monitor (ZEM)“.

      '
    legacy_notice: 'Ein einmaliger Upgrade-Hinweis darf erklären, dass Zrzavy Energy Monitor

      der neue Name des früheren Projekts SolarInspector ist.

      '
release_and_update_strategy:
  strategy: single_direct_migration
  source:
    product_name: SolarInspector
    version: 4.1.3
    repository: zrzavywa/SolarInspector
    asset_pattern: SolarInspector-4.1.3.tar.gz
  target:
    product_name: Zrzavy Energy Monitor
    version: 4.5.0
    repository: zrzavywa/zrzavy-energy-monitor
    asset_pattern: zrzavy-energy-monitor-4.5.0.tar.gz
  requirements:
  - Kein Bridge-Release erstellen.
  - Keine Dual-Repository- oder Dual-Asset-Erkennung als dauerhafte Produktlogik einführen.
  - Vor der Migration ein vollständiges Backup der einzigen 4.1.3-Installation erstellen.
  - Die neue 4.5.0-Version als vollständiges Release-Artefakt erzeugen und lokal prüfen.
  - Das Upgrade erfolgt einmalig über ein dediziertes Migrationsskript beziehungsweise einen kontrollierten
    manuellen Ablauf.
  - Der vorhandene 4.1.3-Updater muss nicht selbst das neue Repository oder den neuen Assetnamen erkennen.
  - Nach erfolgreicher Migration verwendet die Anwendung nur noch das neue Repository und neue Release-Artefakte.
  - Rollback auf die gesicherte 4.1.3-Installation muss möglich und dokumentiert sein.
  direct_upgrade_sequence:
  - SolarInspector 4.1.3 stoppen.
  - Konfiguration, Datenbank, Logs, systemd-Units und Installationspfade sichern.
  - SQLite-Integrität prüfen.
  - Zrzavy Energy Monitor 4.5.0 in neuen Zielpfaden installieren.
  - Konfiguration und Datenbank übernehmen beziehungsweise migrieren.
  - Neue systemd-Units installieren.
  - Neuen Service starten.
  - Healthcheck, Dashboard, Gerätezugriff und Datenhistorie prüfen.
  - Bei Erfolg alte Units deaktivieren und alte Pfade als Rollbackkopie behalten.
  - Bei Fehler neuen Service stoppen und 4.1.3 aus dem Backup wiederherstellen.
  repository_rename:
    timing:
    - Quellcode und Dokumentation sind auf den neuen Namen vorbereitet.
    - Release-Pipeline erzeugt zrzavy-energy-monitor-4.5.0.tar.gz.
    - Direkte Migration wurde gegen eine Kopie der produktiven 4.1.3-Installation erfolgreich getestet.
    - Rollback wurde erfolgreich getestet.
    post_rename_actions:
    - Lokale origin-URL aktualisieren.
    - README-Badges aktualisieren.
    - Updater-Konstanten aktualisieren.
    - Issue- und Release-Links prüfen.
    - Repository-Beschreibung auf die neue Kurzbeschreibung setzen.
scope:
  included:
  - Produktname und öffentliche Texte
  - Repository-Name und GitHub-Links
  - README, Changelog, Contributing, Security und Trademarks
  - Alle Dokumente unter docs/
  - Webseitentitel, Navigation, Footer und Diagnoseansichten
  - API-Produktmetadaten
  - Python-Einstiegspunkt
  - Python-Core-Namespace mit Kompatibilität
  - Umgebungsvariablen
  - Datei- und Verzeichnisnamen
  - Datenbank-, Log- und PID-Dateinamen
  - systemd-Units
  - Updater und Release-Installer
  - Release-Archive, Prüfsummen und Manifest
  - Installations-, Upgrade-, Backup- und Rollback-Skripte
  - GitHub Actions und Release-Automatisierung
  - Tests, Fixtures und Beispieldaten
  - Kommentare, Docstrings, User-Agents und Logmeldungen
  - Deprecation- und Kompatibilitätsstrategie
  excluded:
  - Änderung der fachlichen Energiebilanz
  - Neue Geräteadapter
  - Neue Messwertmetriken
  - Änderung bestehender Vorzeichenkonventionen
  - Nicht für das Rebranding notwendige Datenbankschemaänderungen
  - Neue Cloud- oder Home-Assistant-Funktionen
  - Markenanmeldung oder rechtliche Vertretung
  - Neues grafisches Logo, sofern nicht separat beauftragt
  - Entfernung sämtlicher Legacy-Kompatibilität im ersten Release
agent_behavior:
  inspect_before_change: true
  do_not_assume_repository_structure: true
  preserve_existing_data: true
  preserve_existing_api_behavior: true
  preserve_existing_measurement_semantics: true
  use_git_mv_for_tracked_renames: true
  require_tests_after_each_block: true
  require_full_regression_after_major_blocks: true
  require_documentation_in_same_block: true
  require_diff_review_before_commit: true
  stop_on_data_loss_risk: true
  stop_on_update_path_regression: true
  human_review_between_blocks: true
  instructions: 'Prüfe vor Änderungen den aktuellen Stand von main und die tatsächlich

    vorhandenen Dateien.


    Verändere keine fachliche Mess- oder Energiebilanzlogik, sofern dies nicht

    zwingend für die Namensmigration erforderlich ist.


    Führe jede Dateiumbenennung mit git mv durch, damit Historie und Review

    nachvollziehbar bleiben.


    Neue Produktlogik darf ausschließlich unter den neuen kanonischen Namen

    implementiert werden. Alte Namen dienen nur als dünne Kompatibilitätsschicht.

    '
coding_and_documentation_standards:
  mandatory: true
  python:
    required:
    - PEP 8
    - PEP 257
    - Google-Style-Docstrings
    - Vollständige Typannotationen für neue und wesentlich geänderte öffentliche Schnittstellen
    - Aussagekräftige Namen
    - Physikalische Einheiten in fachlichen Variablen- und Feldnamen
    - Keine unerklärten Magic Numbers
    - Keine Import-Seiteneffekte
    - Keine kritischen zirkulären Imports
    documentation:
    - Jedes neue Modul besitzt einen Modul-Docstring.
    - Öffentliche Klassen, Funktionen und Methoden besitzen Google-Style-Docstrings.
    - Kompatibilitäts-Wrapper dokumentieren Zweck und geplante Lebensdauer.
    - Deprecation-Warnungen nennen neue Schnittstelle und Übergangszeitraum.
    - Kommentare erklären das Warum, nicht das sichtbare Was.
  shell:
    required:
    - set -Eeuo pipefail für neue Bash-Skripte.
    - Pfade immer korrekt quoten.
    - Vor destruktiven Operationen Voraussetzungen prüfen.
    - Skripte müssen wiederholbar oder eindeutig abbrechbar sein.
    - Keine Ausgabe von Secrets.
    - Dry-Run für Migrationsskripte vorsehen.
  documentation:
    required:
    - Code, README, Installationsanleitung und Beispiele müssen dieselben Namen verwenden.
    - Legacy-Namen nur in einem klar gekennzeichneten Migrationskontext verwenden.
    - Nicht verifiziertes Verhalten nicht als unterstützt dokumentieren.
    - Alle neuen Pfade, Variablen, Services und Release-Namen dokumentieren.
    - Upgrade und Rollback mit vollständigen Befehlen dokumentieren.
    - Historische Changelog-Einträge nicht rückwirkend umschreiben.
  tests:
    required:
    - Testnamen beschreiben Verhalten und Erwartung.
    - Keine echten Produktivdaten in Fixtures.
    - Keine reale Wartezeit, wenn Zeit kontrollierbar ist.
    - Regressionstests prüfen fachliche Ergebnisse, nicht nur fehlende Exceptions.
    - Kompatibilitätstests decken alte und neue Namen ab.
execution_format:
  required_block_structure:
  - block_id
  - title
  - goal
  - preconditions
  - affected_files
  - complete_code_or_context_patches
  - commands
  - targeted_tests
  - regression_tests
  - expected_result
  - review_points
  - abort_conditions
  - commit_message
  rules:
  - Jeder Block bearbeitet genau ein logisch abgeschlossenes Ziel.
  - Jeder Block ist einzeln testbar und commitfähig.
  - Neue Dateien vollständig ausgeben.
  - Bestehende große Dateien nur mit eindeutigen Kontext-Patches ändern.
  - Zusammengehörige Shell-Befehle in kopierbaren Bash-Blöcken bündeln.
  - Keine Formulierung wie 'Rest unverändert'.
  - Bereits erfolgreiche Blöcke nicht wiederholen.
  - Bei Fehlern nur den betroffenen Block korrigieren.
  - Dokumentation ist Teil des jeweiligen Blocks, kein späterer Nachtrag.
initialization:
  commands:
  - git status
  - git branch --show-current
  - git log -1 --oneline
  - git pull --ff-only
  - git switch -c feature/4.5-rebrand-zrzavy-energy-monitor
  - pytest -v tests
  - ruff format --check app tests
  - ruff check app tests
  - mypy <configured-paths>
  abort_conditions:
  - Arbeitsverzeichnis ist nicht sauber.
  - Baseline-Tests schlagen fehl und der Fehler ist nicht bereits dokumentiert.
  - Aktueller Branch enthält nicht gemergte Rebranding-Versuche.
  - Die einzige produktive Datenbank ist im Arbeitsverzeichnis vorhanden.
  - Secrets oder lokale Konfigurationen sind getrackt.
