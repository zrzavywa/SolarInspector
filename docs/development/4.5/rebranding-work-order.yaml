    legacy:
      installation_root: /opt/solarinspector
      config_directory: /etc/solarinspector
      state_directory: /var/lib/solarinspector
      database_file: /var/lib/solarinspector/data/solarinspector.db
      cache_directory: /var/cache/solarinspector
      log_directory: /var/log/solarinspector
    migration_policy:
    - Vor Änderungen konsistentes Backup erstellen.
    - Konfiguration und Datenbank nicht kopieren, solange der alte Service noch schreibt.
    - Alten Collector-Service kontrolliert stoppen.
    - Dateirechte und Eigentümer erhalten oder explizit migrieren.
    - Migration vorzugsweise durch atomisches Verschieben auf demselben Dateisystem.
    - Bei dateisystemübergreifender Migration kopieren, fsync, Integrität prüfen und erst dann aktivieren.
    - Alte Pfade erst nach erfolgreichem Healthcheck entfernen.
    - Für mindestens ein Release optional Legacy-Symlinks anbieten.
    - Keine rekursiven Symlinks erzeugen.
