test_matrix:
  branding:
  - Zentrale Branding-Konstanten liefern exakt die kanonischen Werte.
  - Weboberfläche zeigt vollständigen Produktnamen.
  - API liefert neue Produktmetadaten.
  - ZEM erscheint nicht alleinstehend als öffentlicher Name.
  environment:
  - Neue Variable wird verwendet.
  - Alte Variable wird als Fallback verwendet.
  - Deprecation-Warnung erscheint einmal.
  - Neue Variable gewinnt bei Konflikt.
  - Secret-Wert erscheint niemals im Log.
  paths:
  - Neue Installation verwendet neue Pfade.
  - Legacy-Installation wird erkannt.
  - Explizite neue Pfade gewinnen.
  - Explizite Legacy-Pfade bleiben verwendbar.
  - Import erzeugt keine Verzeichnisse.
  entrypoints:
  - Neuer Einstiegspunkt startet die Anwendung.
  - Alter Einstiegspunkt startet denselben Code über Wrapper.
  - Alter Einstiegspunkt zeigt Deprecation-Warnung.
  - Beide Einstiegspunkte liefern denselben Healthcheck.
  namespace:
  - Neue Imports funktionieren.
  - Erforderliche alte Imports funktionieren über Wrapper.
  - Es existiert nur eine kanonische Implementierung.
  - Keine zirkulären Imports.
  updater:
  - Neuer Updater verwendet ausschließlich das neue Repository.
  - Neuer Updater akzeptiert das neue Release-Artefakt.
  - Falsche product_id wird abgelehnt.
  - Prüfsummenprüfung bleibt wirksam.
  - Release-Manifest wird validiert.
  - Rollback funktioniert nach fehlgeschlagenem Healthcheck.
  systemd:
  - Nur alter Service aktiv.
  - Dry Run verändert nichts.
  - Migration stoppt alten Service.
  - Neuer Service startet.
  - Healthcheck erfolgreich.
  - Alter Service wird deaktiviert.
  - Rollback reaktiviert alten Service.
  - Kein paralleler Collector.
  data:
  - Konfiguration bleibt bytegleich oder semantisch gleich.
  - Datenbankzeilenanzahl bleibt erhalten.
  - PRAGMA integrity_check vor und nach Migration ist ok.
  - Nullwerte bleiben Nullwerte.
  - NULL bleibt NULL.
  - Historische Zeitstempel bleiben erhalten.
  - Direktes Upgrade 4.1.3 auf 4.5.0 erhält alle Messdaten.
  docs:
  - Alle aktuellen Links zeigen auf neues Repository.
  - Alle aktuellen Installationsbefehle verwenden neue Pfade.
  - Legacy-Namen erscheinen nur in Historie und Migration.
  - Kurzbeschreibung ist überall konsistent.
  regression:
  - Tasmota bleibt funktionsfähig.
  - SHRDZM bleibt funktionsfähig.
  - Shelly bleibt funktionsfähig.
  - Solakon bleibt funktionsfähig.
  - Validierung bleibt funktionsfähig.
  - Quellenpriorisierung bleibt funktionsfähig.
  - Energiebilanz bleibt funktionsfähig.
  - SQLite-Persistenz bleibt funktionsfähig.
  - CSV-Export bleibt funktionsfähig.
  - Dashboard und API bleiben funktionsfähig.
