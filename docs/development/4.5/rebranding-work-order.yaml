      config_path: SOLARINSPECTOR_CONFIG_PATH
      database_path: SOLARINSPECTOR_DATABASE_PATH
      update_status_path: SOLARINSPECTOR_UPDATE_STATUS_PATH
      update_request_path: SOLARINSPECTOR_UPDATE_REQUEST_PATH
      update_cache_dir: SOLARINSPECTOR_UPDATE_CACHE_DIR
    precedence:
