    - Bestehende fachliche JSON-Struktur, soweit nicht additiv erweitert
database_and_data_migration:
  schema_change_required: false
  rules:
  - Keine Messwerttabelle nur wegen des Namens ändern.
  - Keine historischen Messdaten umschreiben.
  - Keine source_id oder metric umbenennen, sofern sie nicht den Produktnamen selbst enthalten.
  - Datenbankintegrität vor und nach Dateimigration prüfen.
  - SQLite-Backup-API oder konsistente Stop-and-copy-Strategie verwenden.
  - Neue Datenbankdatei darf erst nach erfolgreicher Integritätsprüfung aktiviert werden.
  filename_migration:
    source: solarinspector.db
    target: zrzavy-energy-monitor.db
    requirements:
    - Dry Run verfügbar.
    - Backup vor Umbenennung.
    - PRAGMA integrity_check vor Migration.
    - PRAGMA integrity_check nach Migration.
    - Dateirechte und Eigentümer erhalten.
    - Rollback stellt alte Datei und alte Service-Konfiguration wieder her.
    - Bestehende Konfiguration mit explizitem alten Datenbankpfad bleibt funktionsfähig.
  log_and_pid:
    rules:
    - Alte Logs nicht löschen.
    - Neue Laufzeit schreibt in neue Logdatei.
    - Alte PID-Datei nur entfernen, wenn kein alter Prozess läuft.
    - Keine PID-Kollision zwischen altem und neuem Service.
systemd_migration:
  required_files:
  - systemd/zrzavy-energy-monitor.service
  - systemd/zrzavy-energy-monitor-updater.service
  - systemd/zrzavy-energy-monitor-updater.path
  migration_script:
    suggested_path: scripts/migrate-to-zrzavy-energy-monitor.sh
    required_options:
    - --dry-run
    - --apply
    - --rollback
    - --keep-legacy-paths
    required_steps:
    - Root-Rechte prüfen.
    - Aktive alte Units erkennen.
    - Konfiguration und Datenbank sichern.
    - Alten Collector-Service stoppen.
    - Alte Updater-Path-Unit stoppen.
    - Zielverzeichnisse anlegen.
    - Konfiguration und Daten migrieren.
    - Neue Units installieren.
    - systemctl daemon-reload.
    - Neuen Service starten.
    - Healthcheck ausführen.
    - Bei Fehler automatisch auf alten Zustand zurückrollen.
    - Bei Erfolg alte Units deaktivieren.
    - Status und nächste Schritte ausgeben.
    safety:
    - Nie beide Collector-Services parallel starten.
    - Kein rm -rf auf variablen oder unvalidierten Pfaden.
    - Zielpfade müssen feste erwartete Präfixe besitzen.
    - Rollback auch nach teilweise installierten Units ermöglichen.
    - Exitcodes dokumentieren.
  service_user:
    default_for_upgrade: solarinspector
    default_for_new_install: zemonitor
    note: 'Die Service-Benutzer-Migration ist von der Produktumbenennung zu trennen.

      Bestehende Installationen behalten standardmäßig die alte UID und den

      alten Benutzer, solange dies keine sichtbare Produktkennzeichnung ist.

      '
updater_and_release:
  updater:
    requirements:
    - Neue Repository-Konstante zentral beziehen.
    - Repository ausschließlich auf zrzavywa/zrzavy-energy-monitor umstellen.
    - Release-Artefakte ausschließlich mit zrzavy-energy-monitor-<VERSION>.tar.gz erwarten.
    - User-Agent auf ZrzavyEnergyMonitor/<VERSION> umstellen.
    - Temporäre Verzeichnisse mit zrzavy-energy-monitor-update- benennen.
    - Fehlermeldungen auf den neuen Produktnamen umstellen.
    - Release-Manifest auf product_id zrzavy-energy-monitor prüfen.
    - Der alte 4.1.3-Updater ist nicht Teil des direkten Upgradepfads.
  release_installer:
    requirements:
    - Neuen Top-Level-Archivordner akzeptieren.
    - Traversal-Schutz und Größenlimits beibehalten.
    - Persistente Pfade nicht in das Release-Archiv aufnehmen.
    - Aktivierung, Healthcheck und Rollback unter den neuen Services testen.
  release_manifest:
    required_fields:
    - product_name
    - product_id
    - version
    - repository
    - archive_name
    - sha256
  github_actions:
    update:
    - Repository- und Badge-Links
    - Release-Archivname
    - Prüfsummendatei
    - Manifestwerte
    - Artifact-Uploads
    - Release-Notes-Template
    - Cache-Keys nur, wenn sie den Produktnamen enthalten
    verification:
    - Workflow-Syntax prüfen.
    - Test-Release ohne Veröffentlichung erzeugen.
    - Archivinhalt prüfen.
    - Keine config.json, Datenbank, Logs, Secrets oder .venv im Archiv.
