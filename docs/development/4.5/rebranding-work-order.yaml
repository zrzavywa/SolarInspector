      '
  deliverable: docs/development/4.5/rebranding-inventory.md
architecture:
  branding_module:
    suggested_path: app/zrzavy_energy_monitor_core/branding.py
    purpose: Zentrale kanonische Produkt- und Repository-Metadaten.
    suggested_constants:
    - PRODUCT_NAME = 'Zrzavy Energy Monitor'
    - PRODUCT_ID = 'zrzavy-energy-monitor'
    - PRODUCT_DESCRIPTION = 'Open-source home energy monitoring and validation'
    - PRODUCT_ABBREVIATION = 'ZEM'
    - GITHUB_OWNER = 'zrzavywa'
    - GITHUB_REPOSITORY = 'zrzavy-energy-monitor'
    - LEGACY_PRODUCT_NAME = 'SolarInspector'
    - LEGACY_GITHUB_REPOSITORY = 'SolarInspector'
    requirements:
    - Keine Netzwerk- oder Dateisystemseiteneffekte beim Import.
    - UI, API, Updater und Release-Logik beziehen kanonische Werte zentral.
    - Abkürzung wird nicht als alleiniger öffentlicher Name ausgegeben.
  environment_resolver:
    suggested_path: app/zrzavy_energy_monitor_core/environment.py
    behavior:
    - Neue Variable zuerst lesen.
    - Legacy-Variable als Fallback lesen.
    - Bei Legacy-Nutzung genau eine Deprecation-Warnung ausgeben.
    - Bei Konflikt neue Variable verwenden.
    - Secret-Werte niemals protokollieren.
    required_tests:
    - Nur neue Variable gesetzt.
    - Nur alte Variable gesetzt.
    - Beide identisch.
    - Beide unterschiedlich.
    - Keine Variable gesetzt.
    - Secret bleibt in Logs verborgen.
  path_resolver:
    suggested_path: app/zrzavy_energy_monitor_core/paths.py
    behavior:
    - Explizite neue Umgebungsvariable verwenden.
    - Legacy-Umgebungsvariable verwenden.
    - Bei bestehender Legacy-Installation kontrollierten Altpfad erkennen.
    - Bei neuer Installation ausschließlich neuen Pfad verwenden.
    - Keine Verzeichnisse beim Import erstellen.
    migration_guard: 'Eine automatische Pfadmigration darf nicht durch den reinen Import des

      Moduls ausgelöst werden.

      '
  compatibility_entrypoint:
    new_entrypoint: app/zrzavy_energy_monitor.py
    legacy_entrypoint: app/solarinspector.py
    requirement: 'app/solarinspector.py wird zu einem dünnen Wrapper, der den neuen

      Einstiegspunkt aufruft und eine klare Deprecation-Warnung ausgibt.

      Der Wrapper enthält keine eigene Anwendungslogik.

      '
  compatibility_namespace:
    new_namespace: app/zrzavy_energy_monitor_core
    legacy_namespace: app/solarinspector_core
    strategy: 'Verschiebe die kanonische Implementierung mit git mv in den neuen

      Namespace. Stelle für tatsächlich öffentlich oder in Tests verwendete

      Legacy-Importpfade gezielte Wrapper bereit.


      Erzeuge keine zweite vollständige Kopie des Pakets. Prüfe, welche alten

      Importpfade real benötigt werden. Dokumentiere alle verbleibenden

      Wrapper und decke sie durch Tests ab.

      '
    removal_policy: 'Legacy-Importpfade bleiben mindestens während der 4.5-Reihe erhalten,

      sofern sie in veröffentlichten Versionen erreichbar waren.

      '
web_and_api_updates:
