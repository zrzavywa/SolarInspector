repository_rename_gate:
  mandatory: true
  conditions:
  - Release-Artefakt zrzavy-energy-monitor-4.5.0.tar.gz wurde gebaut und geprüft.
  - Direkte Migration wurde gegen eine Kopie der einzigen produktiven 4.1.3-Installation getestet.
  - SQLite-Integrität und Messhistorie wurden vor und nach der Migration verglichen.
  - Neue systemd-Units, Healthcheck und Gerätezugriffe funktionieren.
  - Rollback auf die gesicherte 4.1.3-Installation wurde getestet.
  - README, Badges und Release-Pipeline sind vorbereitet.
  - Vollständige Testsuite ist grün.
  - Keine Secrets oder produktiven Daten befinden sich im Diff.
  prohibited_before_gate:
  - GitHub-Repository umbenennen
  - Produktive 4.1.3-Installation überschreiben
  - Alte systemd-Units löschen
  - Alte Datenbank oder Konfiguration löschen
required_commands:
  inventory:
  - git grep -n -I -E 'SolarInspector|SOLARINSPECTOR|solarinspector|Solarinspector'
  - find . -type f \( -name '*solarinspector*' -o -name '*SolarInspector*' \) -print
  targeted_tests:
  - pytest -v tests/test_branding.py
  - pytest -v tests/test_environment.py
  - pytest -v tests/test_paths.py
  - pytest -v tests/test_github_updater.py
  - pytest -v tests/test_release_installer.py
  - pytest -v tests/test_updater_service.py
  - pytest -v tests/test_runtime.py
  - pytest -v tests/test_web.py
  - pytest -v tests/test_update_api.py
  full_tests:
  - pytest -v tests
  - pytest --cov=app --cov-report=term-missing tests
  quality:
  - ruff format --check app tests
  - ruff check app tests
  - mypy <configured-paths>
  - git diff --check
  import_checks:
  - python -c "import sys; sys.path.insert(0, 'app'); import zrzavy_energy_monitor"
  - python -c "import sys; sys.path.insert(0, 'app'); import solarinspector"
  - python -c "import sys; sys.path.insert(0, 'app'); import zrzavy_energy_monitor_core"
  - python -c "import sys; sys.path.insert(0, 'app'); import solarinspector_core"
  manual_start:
  - ZRZAVY_ENERGY_MONITOR_SECRET='<test-secret>' python app/zrzavy_energy_monitor.py --no-browser
  - SOLARINSPECTOR_SECRET='<test-secret>' python app/solarinspector.py --no-browser
  final_inventory:
  - git grep -n -I -E 'SolarInspector|SOLARINSPECTOR|solarinspector|Solarinspector'
  - git status
  - git diff --stat
  - git diff
acceptance_criteria:
  branding:
  - Aktueller öffentlicher Produktname ist überall Zrzavy Energy Monitor.
  - Kurzbeschreibung ist überall exakt Open-source home energy monitoring and validation.
  - ZEM wird nicht alleinstehend als öffentliche Marke verwendet.
  - SolarInspector erscheint nur noch in erlaubtem Legacy- oder Historienkontext.
  repository:
  - Zielrepository heißt zrzavywa/zrzavy-energy-monitor.
  - Updater und Dokumentation verwenden den neuen Repository-Namen.
  - Alte GitHub-Links sind nur in Migrationshinweisen oder Fallbacklogik vorhanden.
  runtime:
  - Neuer Einstiegspunkt funktioniert.
  - Alter Einstiegspunkt funktioniert als Wrapper.
  - Neuer Core-Namespace ist kanonisch.
  - Erforderliche Legacy-Imports funktionieren.
  - Keine doppelte Produktlogik.
  environment:
  - Alle neuen ZRZAVY_ENERGY_MONITOR_* Variablen funktionieren.
  - Alle dokumentierten SOLARINSPECTOR_* Variablen funktionieren als Legacy-Fallback.
  - Neue Variablen haben Vorrang.
  - Keine Secrets werden geloggt.
  data:
  - Konfiguration und SQLite-Daten bleiben vollständig erhalten.
  - Datenbankintegrität ist vor und nach Migration ok.
  - Keine künstlichen Nullwerte oder NULL-Änderungen.
  - Rollback stellt die alte Installation wieder her.
  linux:
  - Neue systemd-Units funktionieren.
  - Alter und neuer Collector laufen nie gleichzeitig.
  - Dry Run verändert das System nicht.
  - Automatischer Rollback nach fehlgeschlagenem Healthcheck funktioniert.
  - Neue Installationen verwenden ausschließlich neue Pfade.
  updater:
  - Nach der Migration verwendet Zrzavy Energy Monitor ausschließlich das neue Repository.
  - Neue Release-Artefakte werden korrekt gefunden und geprüft.
  - Prüfsumme, Manifestprüfung, Backup, Healthcheck und Rollback bleiben wirksam.
  - Der alte 4.1.3-Updater wird für das einmalige Upgrade nicht vorausgesetzt.
  compatibility:
  - Bestehende API-Endpunkte bleiben kompatibel.
  - Bestehende Konfigurationen bleiben lesbar.
  - Die einzige 4.1.3-Installation kann direkt auf 4.5.0 migriert werden.
  - Tasmota, SHRDZM, Shelly und Solakon bleiben funktionsfähig.
  - Validierung, Quellenpriorisierung, Energiebilanz, Persistenz und CSV bleiben funktionsfähig.
  documentation:
  - Alle aktuellen Dokumente verwenden neue Namen und Pfade.
  - Migration und Rollback sind vollständig dokumentiert.
  - Historische Changelog-Einträge wurden nicht verfälscht.
  - Markenhinweise behaupten keine nicht vorhandene Registrierung.
  quality:
  - Alle Tests sind erfolgreich.
  - Ruff ist erfolgreich.
  - Mypy ist für die konfigurierten Pfade erfolgreich.
