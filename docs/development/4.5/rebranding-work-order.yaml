      releases_directory: /opt/zrzavy-energy-monitor/releases
      current_symlink: /opt/zrzavy-energy-monitor/current
      updater_directory: /opt/zrzavy-energy-monitor/updater
      config_directory: /etc/zrzavy-energy-monitor
      config_file: /etc/zrzavy-energy-monitor/config.json
      state_directory: /var/lib/zrzavy-energy-monitor
      data_directory: /var/lib/zrzavy-energy-monitor/data
      database_file: /var/lib/zrzavy-energy-monitor/data/zrzavy-energy-monitor.db
      backup_directory: /var/lib/zrzavy-energy-monitor/backups
      cache_directory: /var/cache/zrzavy-energy-monitor/updates
      log_directory: /var/log/zrzavy-energy-monitor
