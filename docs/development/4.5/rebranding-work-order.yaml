schema_version: '1.0'
task:
  id: zrzavy-energy-monitor-direct-rebranding
  title: Direkte Migration von SolarInspector 4.1.3 zu Zrzavy Energy Monitor 4.5.0
  language: de
  task_type: software-development
  execution_mode: blockwise
  priority: high
  target_release: 4.5.0
repository:
  current:
    owner: zrzavywa
    name: SolarInspector
    full_name: zrzavywa/SolarInspector
    url: https://github.com/zrzavywa/SolarInspector
    default_branch: main
  target:
    owner: zrzavywa
    name: zrzavy-energy-monitor
    full_name: zrzavywa/zrzavy-energy-monitor
    url: https://github.com/zrzavywa/zrzavy-energy-monitor
  working_branch: feature/4.5-rebrand-zrzavy-energy-monitor
  rename_timing: Das GitHub-Repository wird im Rahmen derselben Rebranding-Phase umbenannt, nachdem Quellcode,
    Update-Mechanismus, Release-Artefakte, Dokumentation und die lokale 4.1.3-Migration vorbereitet und
    getestet wurden.
branding:
  canonical:
    product_name: Zrzavy Energy Monitor
    product_id: zrzavy-energy-monitor
    repository_name: zrzavy-energy-monitor
    short_description: Open-source home energy monitoring and validation
    executable_name: zrzavy-energy-monitor
    python_entrypoint: zrzavy_energy_monitor.py
    python_package: zrzavy_energy_monitor_core
    release_asset_prefix: zrzavy-energy-monitor
    user_agent: ZrzavyEnergyMonitor
  abbreviation:
    value: ZEM
    policy: 'ZEM ist ausschließlich eine interne oder ergänzende Abkürzung.

      ZEM darf nicht als alleinstehender öffentlicher Produktname,

      Repository-Name, Domainname, Seitentitel, Release-Name oder primäre

      Wortmarke verwendet werden.

      '
    allowed_examples:
    - Zrzavy Energy Monitor (ZEM)
    - ZEM compatibility layer
    - Interne technische Kurzbezeichnung in Variablennamen, sofern dokumentiert
    prohibited_examples:
    - 'Produktname: ZEM'
    - 'Repository: zem'
    - 'Release: ZEM 4.5.0'
    - Seitentitel nur mit ZEM
    - Logo ausschließlich mit ZEM
  legacy:
    product_name: SolarInspector
    product_id: solarinspector
    repository_name: SolarInspector
    python_entrypoint: solarinspector.py
    python_package: solarinspector_core
    release_asset_prefix: SolarInspector
    environment_prefix: SOLARINSPECTOR
    status: retired
    allowed_usage:
    - Kompatibilitätsschicht
    - Migrationslogik
    - Historische Changelog-Einträge
    - Upgrade-Dokumentation
    - Explizite Hinweise auf frühere Versionen
    - Tests für Abwärtskompatibilität
    prohibited_usage:
    - Aktueller sichtbarer Produktname
    - Neue Release-Bezeichnung
    - Neue Installationsanleitung
    - Neue systemd-Unit
    - Neue Umgebungsvariable
    - Neue Datenbankdatei
    - Neue öffentliche API-Metadaten
objective:
  summary: 'Benenne die bestehende SolarInspector-4.1.3-Installation und das Projekt direkt in Zrzavy
    Energy Monitor um und aktualisiere sie in einem kontrollierten Schritt auf Version 4.5.0.


    Das Rebranding umfasst Produkttexte, Quellcode, Python-Namespace, Einstiegspunkt, GitHub-Repository,
    Release-Artefakte, Updater, Linux-Verzeichnisse, systemd-Units, Umgebungsvariablen, Datenbank- und
    Logdateinamen, Weboberfläche, API-Metadaten, Tests und sämtliche Dokumentation.


    Die einzige vorhandene Installation muss vor der Migration vollständig gesichert werden. Konfiguration,
    SQLite-Datenbank und Messhistorie müssen unverändert erhalten bleiben. Bei einem Fehler muss ein dokumentierter
    Rollback auf SolarInspector 4.1.3 möglich sein.'
  goals:
  - Alle aktuellen öffentlichen Produktbezeichnungen auf Zrzavy Energy Monitor umstellen.
  - Das Repository auf zrzavy-energy-monitor vorbereiten und anschließend umbenennen.
  - Bestehende Datenbanken, Konfigurationen und Messdaten vollständig erhalten.
  - Neue ZRZAVY_ENERGY_MONITOR_* Variablen als kanonische Schnittstelle einführen.
  - Bestehende systemd-Installationen kontrolliert auf neue Units umstellen.
  - Neue Installationen ausschließlich mit neuen Namen anlegen.
  - Legacy-Namen nur noch in expliziter Kompatibilitäts- und Historienlogik zulassen.
  - Dokumentation, Tests, UI, API und Betriebsdateien konsistent aktualisieren.
  - Eine direkte Migration von SolarInspector 4.1.3 auf Zrzavy Energy Monitor 4.5.0 bereitstellen.
  - Ein einmaliges, getestetes Upgrade-Skript mit Dry Run, Backup, Healthcheck und Rollback bereitstellen.
critical_migration_principles:
- Kein blindes globales Suchen und Ersetzen.
- Keine Löschung oder Überschreibung der einzigen vorhandenen Datenbank.
- Keine Entfernung alter Umgebungsvariablen im ersten Zrzavy-Energy-Monitor-Release.
- Keine gleichzeitige Aktivierung alter und neuer Collector-Services.
- Ein echter Nullwert in Messdaten bleibt unverändert.
- Datenbankschema und fachliche Metriknamen werden nicht allein wegen des Rebrandings verändert.
- Legacy-Kompatibilität muss sichtbar dokumentiert und automatisiert getestet sein.
- Jeder migrationsrelevante Schritt muss rücksetzbar sein.
- Die Repository-Umbenennung darf erst nach erfolgreichem lokalen Migrationstest erfolgen.
- Der alte Python-Einstiegspunkt darf nach erfolgreicher Migration als dokumentierter Wrapper erhalten
  bleiben, ist aber nicht als dauerhafte öffentliche Schnittstelle erforderlich.
