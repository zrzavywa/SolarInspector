    - Alter und neuer Anwendungsservice dürfen nie gleichzeitig laufen.
    - Vor Aktivierung des neuen Services den alten Service stoppen und deaktivieren.
    - Erst nach erfolgreichem Healthcheck den alten Service maskieren oder entfernen.
    - Updater-Path-Units müssen in derselben Reihenfolge migriert werden.
