  environment:
    canonical:
      secret: ZRZAVY_ENERGY_MONITOR_SECRET
      config_path: ZRZAVY_ENERGY_MONITOR_CONFIG_PATH
      database_path: ZRZAVY_ENERGY_MONITOR_DATABASE_PATH
      update_status_path: ZRZAVY_ENERGY_MONITOR_UPDATE_STATUS_PATH
      update_request_path: ZRZAVY_ENERGY_MONITOR_UPDATE_REQUEST_PATH
      update_cache_dir: ZRZAVY_ENERGY_MONITOR_UPDATE_CACHE_DIR
    legacy_aliases:
