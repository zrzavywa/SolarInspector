        solarinspector weiterverwenden, um UID-, Besitz- und Rechteprobleme zu

        vermeiden. Der Dienstname und die Pfade werden dennoch migriert.

        '
      optional_final_user: zemonitor
      requirement: 'Eine Änderung des Service-Benutzers darf nur erfolgen, wenn Besitz,

        Gruppen, Dateirechte und Rollback vollständig getestet sind.

        '
